<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="origin">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gute Orte in Bergisch Gladbach</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.2/Control.FullScreen.min.css" crossorigin="">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Krub, Arial, Helvetica, sans-serif;
    }

    #map {
      width: 100%; /* füllt den ganzen Bildschirm */
      /* width: 800px; /* festgelegte Höhe */
      height: 100dvh; /* füllt den ganzen Bildschirm */
      /* height: 600px; /* festgelegte Breite */
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 4px;
    }

    .leaflet-control-layers {
      background: white;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
    }

    .leaflet-control-layers-overlays label {
      display: flex !important;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.2/Control.FullScreen.min.js" crossorigin=""></script>

  <script>
    const map = L.map('map', { fullscreenControl: true }).setView([50.9918, 7.1389], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>-Mitwirkende',
      maxZoom: 19,
    }).addTo(map);

    /* Kategorien */

    const categories = {
      bio: {
        label: "Bio",
        colour: "green",
        layer: L.layerGroup(),
      },
      vegan: {
        label: "Vegan",
        colour: "#4FCFB1",
        layer: L.layerGroup(),
      },
      secondhand: {
        label: "Secondhand",
        colour: "#F08080",
        layer: L.layerGroup(),
      },
      ausleihen: {
        label: "Ausleihen",
        colour: "yellow",
        layer: L.layerGroup(),
      },
      jugend: {
        label: "für Jugendliche",
        colour: "purple",
        layer: L.layerGroup(),
      },
      begegnung: {
        label: "Begegnungsorte",
        colour: "orange",
        layer: L.layerGroup(),
      },
      hilfe: {
        label: "Hilfe für Bedürftige",
        colour: "gray",
        layer: L.layerGroup(),
      }
    };

    /* Orte */

    let places = [];

    fetch('orte.csv')
      .then(response => response.text())
      .then(csvText => {
        const rows = parseCSV(csvText);
        rows.shift(); // Kopfzeile (name, lat, lon, category, desc1...) entfernen

        places = rows
          .filter(row => row.length > 0 && row[0] && row[0].trim() !== '')
          .map(row => {
            const [name, lat, lon, category, ...descLines] = row;
            const description = descLines
              .filter(line => line && line.trim() !== '')
              .join('<br>');

            return {
              name: name,
              coords: [parseFloat(lat), parseFloat(lon)],
              category: category,
              description: description
            };
          });

        renderPlaces();
      })
      .catch(err => console.error('Fehler beim Laden der orte.csv:', err));

    /* Einfacher CSV-Parser, der Kommas und Anführungszeichen innerhalb von Feldern
      sowie doppelte Anführungszeichen ("") als Escape korrekt behandelt */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === '"' && next === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            field += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            row.push(field);
            field = '';
          } else if (char === '\n' || char === '\r') {
            if (field !== '' || row.length > 0) {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            }
            if (char === '\r' && next === '\n') i++;
          } else {
            field += char;
          }
        }
      }
      if (field !== '' || row.length > 0) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    /* entspricht genau dem alten Code-Block, der bisher direkt unter
      const places = [...] stand — jetzt aufgerufen, sobald die Daten da sind */
    function renderPlaces() {
      places.forEach(p => {
        const cat = categories[p.category];
        L.marker(p.coords, { icon: colouredMarker(cat.colour) })
          .bindPopup(`<strong>${p.name}</strong><br>${p.description}`)
          .addTo(cat.layer);
      });

      const overlays = {};
      Object.values(categories).forEach(cat => {
        cat.layer.addTo(map);
        const label = `<span class="legend-dot" style="background:${cat.colour};border:1px solid #aaa"></span>${cat.label}`;
        overlays[label] = cat.layer;
      });

      L.control.layers(null, overlays, { collapsed: false }).addTo(map);
    }

    /* Pin */

    function colouredMarker(colour) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${colour}">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75
                   7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38
                   0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12
                   2.5 2.5S13.38 11.5 12 11.5z"/>
        </svg>`;
      return L.divIcon({
        html: svg,
        className: '',
        iconSize:   [30, 42],
        iconAnchor: [15, 42],
        popupAnchor:[0, -40],
      });
    }

    places.forEach(p => {
      const cat = categories[p.category];
      L.marker(p.coords, { icon: colouredMarker(cat.colour) })
        .bindPopup(`<strong>${p.name}</strong><br>${p.description}`)
        .addTo(cat.layer);
    });

    const overlays = {};
    Object.values(categories).forEach(cat => {
      cat.layer.addTo(map);
      const label = `<span class="legend-dot" style="background:${cat.colour};border:1px solid #aaa"></span>${cat.label}`;
      overlays[label] = cat.layer;
    });

    L.control.layers(null, overlays, { collapsed: false }).addTo(map);
  </script>
</body>
</html>
